<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing.Love - Design Inspiration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #de0086;
            --primary-light: #ff1fa0;
            --primary-dark: #b8005f;
            --bg-dark: #0a0a0a;
            --bg-dark-secondary: #141414;
            --bg-light: #ffffff;
            --bg-light-secondary: #f8f8f8;
            --text-dark: #ffffff;
            --text-light: #000000;
            --border-dark: #252525;
            --border-light: #e5e5e5;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: var(--bg-dark);
            color: var(--text-dark);
            transition: background 0.4s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-x: hidden;
        }

        body.light-mode {
            background: var(--bg-light);
            color: var(--text-light);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 5px;
            transition: background 0.3s;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-light);
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(222, 0, 134, 0.1);
            z-index: 1000;
            padding: 1.5rem 2rem;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        header:hover {
            border-bottom-color: rgba(222, 0, 134, 0.3);
            background: rgba(10, 10, 10, 0.85);
            box-shadow: 0 10px 40px rgba(222, 0, 134, 0.1);
            transition: all 0.4s ease;
        }

        body.light-mode header {
            background: rgba(255, 255, 255, 0.7);
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .theme-toggle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--bg-dark-secondary);
            border: 1.5px solid var(--border-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        body.light-mode .theme-toggle {
            background: var(--bg-light-secondary);
            border-color: var(--border-light);
        }

        .theme-toggle:hover {
            transform: scale(1.15) rotate(20deg);
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(222, 0, 134, 0.4);
        }

        .sun-icon {
            display: block;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform-origin: center;
        }

        .moon-icon {
            display: none;
            position: absolute;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform-origin: center;
        }

        body.light-mode .sun-icon {
            display: none;
            transform: rotate(360deg) scale(0);
        }

        body.light-mode .moon-icon {
            display: block;
            transform: rotate(-360deg) scale(1);
        }

        /* Main */
        main {
            padding-top: 80px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Hero */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(222, 0, 134, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(222, 0, 134, 0.05) 0%, transparent 50%);
            pointer-events: none;
            animation: gradientShift 8s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .hero h1 {
            font-size: 4.5rem;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-light), var(--primary));
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: slideinGradient 3s ease-in-out infinite;
            text-shadow: 0 0 40px rgba(222, 0, 134, 0.2);
            position: relative;
            z-index: 2;
        }

        @keyframes slideinGradient {
            0% { background-position: 0% center; }
            50% { background-position: 100% center; }
            100% { background-position: 0% center; }
        }

        .hero p {
            font-size: 1.3rem;
            opacity: 0.7;
            max-width: 700px;
            margin: 0 auto 2.5rem;
            line-height: 1.6;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-buttons {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .btn {
            padding: 1rem 2.5rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, transparent 50%, rgba(255, 255, 255, 0.1) 50%);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .btn:hover::before {
            transform: translateX(100%);
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }

        .btn:hover::after {
            animation: pulse 1s ease-out infinite;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            box-shadow: 0 4px 20px rgba(222, 0, 134, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 40px rgba(222, 0, 134, 0.5);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-secondary:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-3px);
        }

        /* Filters Section */
        .filters-section {
            padding: 4rem 0;
            position: sticky;
            top: 80px;
            background: var(--bg-dark);
            background: linear-gradient(to bottom, var(--bg-dark), rgba(10, 10, 10, 0.8));
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        body.light-mode .filters-section {
            background: var(--bg-light);
            background: linear-gradient(to bottom, var(--bg-light), rgba(255, 255, 255, 0.8));
        }

        .filter-label {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
            margin-bottom: 1rem;
            display: block;
        }

        .filters-wrapper {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding: 1rem 0;
            scroll-behavior: smooth;
            cursor: grab;
            scrollbar-width: thin;
        }

        .filters-wrapper:active {
            cursor: grabbing;
        }

        .filter-pill {
            padding: 0.75rem 1.8rem;
            border: 2px solid var(--border-dark);
            background: transparent;
            color: var(--text-dark);
            border-radius: 50px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-weight: 600;
            font-size: 0.95rem;
            position: relative;
            overflow: hidden;
        }

        body.light-mode .filter-pill {
            color: var(--text-light);
            border-color: var(--border-light);
        }

        .filter-pill::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 50px;
            opacity: 0;
            z-index: -1;
            transition: opacity 0.3s ease;
        }

        .filter-pill::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--primary);
            border-radius: 50px;
            opacity: 0;
            z-index: -1;
            transition: opacity 0.3s ease;
        }

        .filter-pill:hover {
            border-color: var(--primary);
            color: white;
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 8px 20px rgba(222, 0, 134, 0.3);
        }

        .filter-pill:hover::after {
            opacity: 0.2;
        }

        .filter-pill.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-color: var(--primary);
            color: white;
            box-shadow: 0 8px 30px rgba(222, 0, 134, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        /* Grid */
        .designs-section {
            padding: 4rem 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2.5rem;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 2rem;
            }
        }

        /* Cards */
        .card {
            background: var(--bg-dark-secondary);
            border: 1px solid var(--border-dark);
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            will-change: transform;
            opacity: 0;
            animation: fadeInUp 0.6s ease-out forwards;
            box-shadow: 0 10px 40px rgba(222, 0, 134, 0.05);
        }

        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(222, 0, 134, 0.1), transparent 50%);
            opacity: 0;
            z-index: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .card:hover::after {
            opacity: 1;
        }

        body.light-mode .card {
            background: var(--bg-light-secondary);
            border-color: var(--border-light);
            box-shadow: 0 10px 40px rgba(222, 0, 134, 0.08);
        }

        .card:hover {
            transform: translateY(-20px) scale(1.03);
            border-color: var(--primary);
            box-shadow: 0 40px 80px rgba(222, 0, 134, 0.3), inset 0 0 40px rgba(222, 0, 134, 0.05);
            background: linear-gradient(135deg, var(--bg-dark-secondary), rgba(222, 0, 134, 0.05));
        }

        body.light-mode .card:hover {
            box-shadow: 0 40px 80px rgba(222, 0, 134, 0.25), inset 0 0 40px rgba(222, 0, 134, 0.08);
            background: linear-gradient(135deg, var(--bg-light-secondary), rgba(222, 0, 134, 0.03));
        }

        .card-image {
            width: 100%;
            height: 240px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            position: relative;
            overflow: hidden;
            animation: gradientFlow 3s ease infinite;
        }

        .card-image::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="white" stroke-width="0.5" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/><circle cx="25" cy="25" r="1.5" fill="white" opacity="0.2"/><circle cx="75" cy="35" r="1" fill="white" opacity="0.15"/></svg>');
            animation: slidePattern 3s linear infinite;
        }

        .card:hover .card-image {
            animation: gradientFlow 1s ease infinite;
        }

        @keyframes slidePattern {
            0% { transform: translate(0, 0); }
            100% { transform: translate(100px, 100px); }
        }

        .card-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .card:hover .card-image::after {
            opacity: 1;
        }

        .card-shine {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.1) 50%, transparent 70%);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .card-content {
            padding: 2rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        .card-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--primary);
            font-weight: 800;
            margin-bottom: 0.8rem;
            display: inline-block;
            opacity: 0;
            animation: fadeInUp 0.6s ease-out 0.2s forwards;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            line-height: 1.3;
            opacity: 0;
            animation: fadeInUp 0.6s ease-out 0.4s forwards;
        }

        .card-description {
            font-size: 0.95rem;
            opacity: 0.6;
            margin-bottom: 1.5rem;
            flex-grow: 1;
            line-height: 1.5;
            opacity: 0;
            animation: fadeInUp 0.6s ease-out 0.6s forwards;
        }

        .card-tags {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .card-tag {
            padding: 0.4rem 1rem;
            background: var(--primary);
            opacity: 0.15;
            color: var(--primary);
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .card:hover .card-tag {
            opacity: 0.3;
        }

        .card-button {
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s ease;
            width: 100%;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out 0.8s both;
        }

        .card-button::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s;
        }

        .card-button:hover::before {
            transform: translateX(100%);
        }

        .card-button:hover {
            transform: scale(1.08) translateY(-2px);
            box-shadow: 0 12px 40px rgba(222, 0, 134, 0.5);
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
        }

        .card-button:active {
            transform: scale(0.98);
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 5rem;
            flex-wrap: wrap;
        }

        .pagination button {
            width: 45px;
            height: 45px;
            border: 2px solid var(--border-dark);
            background: transparent;
            color: var(--text-dark);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-weight: 600;
            font-size: 1rem;
            position: relative;
        }

        body.light-mode .pagination button {
            color: var(--text-light);
            border-color: var(--border-light);
        }

        .pagination button:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
        }

        .pagination button.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-color: var(--primary);
            color: white;
            box-shadow: 0 4px 20px rgba(222, 0, 134, 0.4);
        }

        /* Footer */
        footer {
            padding: 4rem 0 2rem;
            border-top: 1px solid var(--border-dark);
            margin-top: 6rem;
            text-align: center;
            opacity: 0.6;
            font-size: 0.9rem;
        }

        /* Scroll indicator */
        .scroll-indicator {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s ease-in-out infinite;
            font-size: 2rem;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        /* Enhanced Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(222, 0, 134, 0.5)); }
            50% { filter: drop-shadow(0 0 20px rgba(222, 0, 134, 0.8)); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-16px); }
        }

        @keyframes rotateIn {
            from {
                opacity: 0;
                transform: rotate(-10deg) scale(0.8);
            }
            to {
                opacity: 1;
                transform: rotate(0) scale(1);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes orbit {
            from { transform: rotate(0deg) translateX(100px) rotate(0deg); }
            to { transform: rotate(360deg) translateX(100px) rotate(-360deg); }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Stagger animations */
        .hero h1 {
            animation: fadeInDown 0.8s ease-out forwards;
        }

        .hero p {
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .hero-buttons {
            animation: scaleIn 0.8s ease-out 0.4s both;
        }

        /* Enhanced card animation on hover */
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(222, 0, 134, 0.1), transparent 50%);
            opacity: 0;
            z-index: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover::before {
            opacity: 1;
        }

        /* Glow effect */
        .card.glowing {
            animation: glow 2s ease-in-out infinite;
        }

        /* Section reveals */
        .designs-section {
            animation: fadeInUp 0.8s ease-out forwards;
        }

        /* Smooth transitions for all */
        * {
            transition: background-color 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .hero h1 {
                font-size: 3.5rem;
            }
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }

            .hero p {
                font-size: 1.1rem;
            }

            .hero-buttons {
                gap: 1rem;
            }

            .btn {
                padding: 0.9rem 2rem;
            }

            .container {
                padding: 0 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">✨ Design.Love</div>
            <button class="theme-toggle" id="themeToggle">
                <span class="sun-icon">☀️</span>
                <span class="moon-icon">🌙</span>
            </button>
        </div>
    </header>

    <main>
        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-content">
                <h1>Discover Stunning Design</h1>
                <p>Explore the most beautiful landing pages and web experiences for endless inspiration</p>
                <div class="hero-buttons">
                    <button class="btn btn-primary">Explore Designs</button>
                    <button class="btn btn-secondary">Learn More</button>
                </div>
            </div>
            <div class="scroll-indicator">👇</div>
        </section>

        <!-- Filters -->
        <section class="filters-section">
            <div class="container">
                <span class="filter-label">Filter By</span>
                <div class="filters-wrapper" id="filtersWrapper">
                    <button class="filter-pill active" data-filter="all">All Designs</button>
                    <button class="filter-pill" data-filter="minimal">Minimal</button>
                    <button class="filter-pill" data-filter="portfolio">Portfolio</button>
                    <button class="filter-pill" data-filter="3d">3D & Motion</button>
                    <button class="filter-pill" data-filter="dark">Dark Mode</button>
                    <button class="filter-pill" data-filter="animated">Animated</button>
                    <button class="filter-pill" data-filter="ecommerce">E-commerce</button>
                    <button class="filter-pill" data-filter="corporate">Corporate</button>
                    <button class="filter-pill" data-filter="startup">Startup</button>
                </div>
            </div>
        </section>

        <!-- Designs Grid -->
        <section class="designs-section">
            <div class="container">
                <div class="grid" id="grid"></div>
                <div class="pagination" id="pagination"></div>
            </div>
        </section>

        <!-- Footer -->
        <footer>
            <div class="container">
                <p>&copy; 2024 Design.Love • Curated design inspiration • Made with ✨</p>
            </div>
        </footer>
    </main>

    <script>
        // Track mouse position for dynamic effects
        let mouseX = 0;
        let mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX / window.innerWidth;
            mouseY = e.clientY / window.innerHeight;
        });

        // Sample Designs Data
        const designs = [
            {
                id: 1,
                title: "Minimalist SaaS Platform",
                category: "Minimal",
                tags: ["Clean", "Modern", "SaaS"],
                description: "Sleek and minimal SaaS landing with focus on simplicity and conversion"
            },
            {
                id: 2,
                title: "Creative Portfolio Showcase",
                category: "Portfolio",
                tags: ["Design", "Showcase", "Creative"],
                description: "Beautiful artist portfolio with smooth scrolling and gallery effects"
            },
            {
                id: 3,
                title: "3D Motion Experience",
                category: "3D",
                tags: ["3D", "Interactive", "WebGL"],
                description: "Interactive 3D elements for engaging immersive experiences"
            },
            {
                id: 4,
                title: "Dark Tech Innovators",
                category: "Dark",
                tags: ["Dark", "Tech", "Modern"],
                description: "Premium dark mode tech company landing page with animations"
            },
            {
                id: 5,
                title: "Animated Story Hub",
                category: "Animated",
                tags: ["Animation", "Scroll", "Story"],
                description: "Scroll-driven animations that tell an engaging brand story"
            },
            {
                id: 6,
                title: "E-commerce Master",
                category: "Ecommerce",
                tags: ["Shop", "Product", "Sales"],
                description: "Beautiful online store with product showcase and smooth interactions"
            },
            {
                id: 7,
                title: "Corporate Excellence",
                category: "Corporate",
                tags: ["Professional", "Business", "Enterprise"],
                description: "Enterprise-level design system for B2B companies"
            },
            {
                id: 8,
                title: "Bold Startup Landing",
                category: "Startup",
                tags: ["Startup", "Growth", "Bold"],
                description: "Eye-catching startup landing with vibrant colors and energy"
            },
            {
                id: 9,
                title: "Artist Gallery",
                category: "Portfolio",
                tags: ["Art", "Gallery", "Creative"],
                description: "Stunning art portfolio with immersive gallery experience"
            },
            {
                id: 10,
                title: "Tech Innovation Hub",
                category: "3D",
                tags: ["Innovation", "Tech", "Future"],
                description: "Next-generation technology presentation with cutting-edge visuals"
            },
            {
                id: 11,
                title: "Midnight Catalog",
                category: "Dark",
                tags: ["Catalog", "Dark", "Premium"],
                description: "Premium product catalog with night theme excellence"
            },
            {
                id: 12,
                title: "Scroll Magic Agency",
                category: "Animated",
                tags: ["Magic", "Scroll", "Agency"],
                description: "Mesmerizing scroll-triggered animations and interactions"
            },
            {
                id: 13,
                title: "Zen Minimalist",
                category: "Minimal",
                tags: ["Zen", "Minimal", "Peace"],
                description: "Peaceful minimalist design for meditation app landing"
            },
            {
                id: 14,
                title: "Portfolio Pro",
                category: "Portfolio",
                tags: ["Pro", "Portfolio", "Resume"],
                description: "Professional designer portfolio with interactive elements"
            },
            {
                id: 15,
                title: "WebGL Universe",
                category: "3D",
                tags: ["WebGL", "3D", "Space"],
                description: "Interactive 3D universe experience with particles and effects"
            }
        ];

        const itemsPerPage = 6;
        let currentPage = 1;
        let currentFilter = 'all';

        // Theme Toggle with Smooth Animation
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('theme') || 'dark';

        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            themeToggle.style.animation = 'rotateIn 0.6s ease-out';
        });

        // Drag-to-scroll filters
        const filtersWrapper = document.getElementById('filtersWrapper');
        let isDown = false;
        let startX;
        let scrollLeft;

        filtersWrapper.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX - filtersWrapper.offsetLeft;
            scrollLeft = filtersWrapper.scrollLeft;
            filtersWrapper.style.cursor = 'grabbing';
        });

        filtersWrapper.addEventListener('mouseleave', () => {
            isDown = false;
            filtersWrapper.style.cursor = 'grab';
        });

        filtersWrapper.addEventListener('mouseup', () => {
            isDown = false;
            filtersWrapper.style.cursor = 'grab';
        });

        filtersWrapper.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - filtersWrapper.offsetLeft;
            const walk = (x - startX) * 0.7;
            filtersWrapper.scrollLeft = scrollLeft - walk;
        });

        // Filter Functionality
        document.querySelectorAll('.filter-pill').forEach(pill => {
            pill.addEventListener('click', () => {
                document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
                pill.classList.add('active');
                currentFilter = pill.dataset.filter;
                currentPage = 1;
                renderGrid();
                renderPagination();

                // Smooth scroll to grid
                setTimeout(() => {
                    document.querySelector('.designs-section').scrollIntoView({ behavior: 'smooth' });
                }, 100);
            });

            // Hover animation
            pill.addEventListener('mouseenter', () => {
                pill.style.animation = 'pulse 0.6s ease-out';
            });
        });

        // Enhanced Intersection Observer
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.animation = 'fadeInUp 0.6s ease-out forwards';

                    // Add glow effect to some cards
                    if (Math.random() > 0.7) {
                        setTimeout(() => {
                            entry.target.classList.add('glowing');
                        }, 300);
                    }

                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        // Render Grid with Enhanced Effects
        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            const filtered = currentFilter === 'all'
                ? designs
                : designs.filter(d => d.category.toLowerCase() === currentFilter.toLowerCase());

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginated = filtered.slice(start, end);

            paginated.forEach((design, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${index * 0.1}s`;
                card.style.opacity = '0';
                card.innerHTML = `
                    <div class="card-image">
                        <div class="card-shine"></div>
                    </div>
                    <div class="card-content">
                        <div class="card-category">${design.category}</div>
                        <h3 class="card-title">${design.title}</h3>
                        <p class="card-description">${design.description}</p>
                        <div class="card-tags">
                            ${design.tags.map(tag => `<span class="card-tag">${tag}</span>`).join('')}
                        </div>
                        <button class="card-button">Visit Design →</button>
                    </div>
                `;

                // Mouse move effect on card
                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = (e.clientX - rect.left) / rect.width * 100;
                    const y = (e.clientY - rect.top) / rect.height * 100;
                    card.style.setProperty('--mouse-x', `${x}%`);
                    card.style.setProperty('--mouse-y', `${y}%`);
                });

                card.addEventListener('mouseleave', () => {
                    card.style.setProperty('--mouse-x', '50%');
                    card.style.setProperty('--mouse-y', '50%');
                });

                grid.appendChild(card);
                observer.observe(card);
            });
        }

        // Render Pagination with Animations
        function renderPagination() {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';

            const filtered = currentFilter === 'all'
                ? designs
                : designs.filter(d => d.category.toLowerCase() === currentFilter.toLowerCase());

            const totalPages = Math.ceil(filtered.length / itemsPerPage);

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.className = i === currentPage ? 'active' : '';
                btn.style.animation = `fadeInUp 0.6s ease-out ${i * 0.05}s both`;
                btn.addEventListener('click', () => {
                    currentPage = i;
                    renderGrid();
                    document.querySelector('.grid').scrollIntoView({ behavior: 'smooth' });
                });
                pagination.appendChild(btn);
            }
        }

        // Smooth scroll for hero button
        document.querySelector('.btn-primary').addEventListener('click', () => {
            document.querySelector('.designs-section').scrollIntoView({ behavior: 'smooth' });
        });

        // Enhanced parallax on scroll
        window.addEventListener('scroll', () => {
            const hero = document.querySelector('.hero');
            const scrolled = window.pageYOffset;

            if (hero) {
                hero.style.backgroundPosition = `0 ${scrolled * 0.5}px`;
            }

            // Parallax text effect
            const h1 = document.querySelector('.hero h1');
            if (h1 && scrolled < window.innerHeight) {
                h1.style.transform = `translateY(${scrolled * 0.3}px)`;
            }

            // Parallax for filter section
            const filterSection = document.querySelector('.filters-section');
            if (filterSection) {
                const rect = filterSection.getBoundingClientRect();
                if (rect.top < window.innerHeight && rect.bottom > 0) {
                    filterSection.style.backgroundPosition = `0 ${-scrolled * 0.2}px`;
                }
            }
        });

        // Scroll-triggered animations for elements
        const scrollAnimElements = document.querySelectorAll('.card, .filter-pill, .pagination button');

        const scrollAnimObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.animation = 'fadeInUp 0.6s ease-out forwards';
                    scrollAnimObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1 });

        scrollAnimElements.forEach(el => scrollAnimObserver.observe(el));

        // Initial render
        renderGrid();
        renderPagination();
    </script>
</body>
</html>
